---
- name: Install required dependencies
  apt:
    name:
      - wget
      - curl
      - apt-transport-https
      - gnupg
    state: present
    update_cache: yes

- name: Add JFrog GPG key
  apt_key:
    url: https://releases.jfrog.io/artifactory/api/gpg/key/public
    state: present

- name: Add JFrog repository
  apt_repository:
    repo: deb https://releases.jfrog.io/artifactory/artifactory-debs xenial main
    state: present
    filename: artifactory

- name: Install Artifactory
  apt:
    name: jfrog-artifactory-oss
    state: present
    update_cache: yes

- name: Start and enable Artifactory service
  systemd:
    name: artifactory
    state: started
    enabled: yes

- name: Wait for Artifactory to start
  wait_for:
    port: 8081
    delay: 10
    timeout: 300
